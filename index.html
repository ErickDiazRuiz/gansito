<!DOCTYPE html>
<html lang="es" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>Gansito</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23F4A261' stroke-width='1.8' stroke-linecap='round'><path d='M15.5 5.2a3.1 3.1 0 1 0-4.3 2.9c.4 3.1-1 4.4-3.1 5.4C6 14.5 4.5 16 4.5 18.2c0 2 1.8 3.3 4.3 3.3 4.6 0 8.2-3.4 8.2-8.2 0-2.4-.6-4.2-1.5-5.4'/><path d='M17.4 4.4 21 5.6l-3.4 1.3'/></svg>">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<link rel="manifest" href="manifest.json">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
</head>
<body>

<div id="scan"></div>

<div id="auth" class="login hide">
  <div class="g">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M15.5 5.2a3.1 3.1 0 1 0-4.3 2.9c.4 3.1-1 4.4-3.1 5.4C6 14.5 4.5 16 4.5 18.2c0 2 1.8 3.3 4.3 3.3 4.6 0 8.2-3.4 8.2-8.2 0-2.4-.6-4.2-1.5-5.4"/>
      <path d="M17.4 4.4 21 5.6l-3.4 1.3"/><circle cx="14.6" cy="4.4" r=".9" fill="currentColor" stroke="none"/>
    </svg>
  </div>
  <h1>Gansito</h1>
  <p>Entra para ver tus proyectos</p>
  <input id="au-mail" type="email" placeholder="correo" autocomplete="username">
  <input id="au-pass" type="password" placeholder="contraseña" autocomplete="current-password">
  <button id="au-btn" class="btn" style="width:100%;background:var(--task);color:#2A1505;margin-top:4px">Entrar</button>
  <div id="au-err" style="color:#E06A72;font-size:11px;margin-top:10px;min-height:14px"></div>
</div>

<div id="boot" class="boot">Cargando…</div>

<div id="shell" class="wrap hide">
  <header class="hdr">
    <div class="hdr-in">
      <div class="hdr-row">
        <div class="mark" id="mk">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
            <path d="M15.5 5.2a3.1 3.1 0 1 0-4.3 2.9c.4 3.1-1 4.4-3.1 5.4C6 14.5 4.5 16 4.5 18.2c0 2 1.8 3.3 4.3 3.3 4.6 0 8.2-3.4 8.2-8.2 0-2.4-.6-4.2-1.5-5.4"/>
            <path d="M17.4 4.4 21 5.6l-3.4 1.3"/><circle cx="14.6" cy="4.4" r=".9" fill="currentColor" stroke="none"/>
          </svg>
        </div>
        <div class="brand">Gansito</div>
        <button class="burger" id="bg" aria-label="Menú" aria-expanded="false"><span></span><span></span><span></span></button>
      </div>
      <nav class="crumb" id="cr"></nav>
    </div>
    <div class="dw" id="dw"><div class="dw-in" id="dwin"></div></div>
  </header>
  <main id="app"></main>
</div>

<div id="mo"></div>
<div class="toast" id="ts"><span id="tstx"></span><button id="tsun">Deshacer</button></div>

<script type="module" src="app.js"></script>
</body>
</html>
